<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жанқожа Нұрмұхаммедұлы атындағы цифрлық мұражай · №225 орта мектеп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&family=PT+Serif:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN SYSTEM — түстер, шрифттер, өлшемдер
   ========================================================= */
:root{
  --navy:#102A43; --navy-2:#0B1F33; --navy-3:#173A5C;
  --sky:#DCEEFF; --gold:#D6B36A; --gold-2:#E9CF95;
  --white:#FFFFFF; --mist:#F4F7FB; --muted:#5B7083; --line:rgba(16,42,67,.10);
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-xl:36px;
  --sh-1:0 1px 2px rgba(16,42,67,.06),0 8px 24px rgba(16,42,67,.08);
  --sh-2:0 2px 6px rgba(16,42,67,.08),0 24px 60px rgba(16,42,67,.16);
  --f-display:"Montserrat",system-ui,sans-serif;
  --f-body:"Inter",system-ui,sans-serif;
  --f-serif:"PT Serif",Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --max:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);color:var(--navy);background:var(--mist);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 28px}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.h-display{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:400}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font:600 15px/1 var(--f-body);transition:background .3s var(--ease),color .3s,box-shadow .3s,transform .25s var(--ease);will-change:transform;white-space:nowrap}
.btn svg{flex:none}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--navy-2);box-shadow:0 10px 30px rgba(214,179,106,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{box-shadow:0 16px 40px rgba(214,179,106,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-glass{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-glass:hover{background:rgba(255,255,255,.18)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-3)}
.btn-line{border:1px solid var(--line);background:#fff;color:var(--navy)}
.btn-line:hover{border-color:var(--navy)}
.btn:active{transform:scale(.97)!important}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:background .25s}
.icon-btn:hover{background:rgba(255,255,255,.14)}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:200;background:var(--navy-2);display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s}
#loader.done{opacity:0;visibility:hidden}
.ld-inner{text-align:center;color:#fff}
.ld-mark{text-align:center;font:800 clamp(26px,4.4vw,52px)/1.12 var(--f-display);letter-spacing:-.03em;background:linear-gradient(90deg,#fff 0%,var(--gold-2) 50%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite}
.ld-sub{margin-top:14px;font:500 12px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ld-bar{width:220px;height:2px;margin:30px auto 0;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s var(--ease)}
.ld-pct{margin-top:12px;font:600 12px/1 var(--f-body);color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
@keyframes shine{to{background-position:-200% 0}}

/* ---------- Page transition curtain ---------- */
#curtain{position:fixed;inset:0;z-index:150;pointer-events:none;background:var(--navy-2);transform:translateY(100%)}
#curtain::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#curtain.in{transition:transform .45s var(--ease);transform:translateY(0)}
#curtain.out{transition:transform .55s var(--ease);transform:translateY(-100%)}

/* ---------- Header ---------- */
.hdr{position:fixed;top:0;left:0;right:0;z-index:90;transition:background .35s,box-shadow .35s,backdrop-filter .35s}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:76px}
.hdr.solid{background:rgba(11,31,51,.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand-mark{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(214,179,106,.7),0 6px 18px rgba(0,0,0,.25);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.ld-logo{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;box-shadow:0 0 0 3px rgba(214,179,106,.6),0 0 60px rgba(214,179,106,.35);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(214,179,106,.25),0 0 90px rgba(214,179,106,.5)}}
.hero-emblem{position:relative;display:flex;align-items:center;gap:18px;margin-bottom:24px}
.hero-emblem img{width:96px;height:96px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(214,179,106,.75),0 18px 40px rgba(0,0,0,.4);animation:float 6s ease-in-out infinite}
.hero-emblem div{font:600 13px/1.45 var(--f-body);color:rgba(255,255,255,.8);max-width:340px}
.hero-emblem b{display:block;color:#fff;font:700 15px/1.3 var(--f-display)}
@keyframes float{50%{transform:translateY(-6px)}}
.foot-logo{display:flex;align-items:center;gap:18px}
.foot-logo img{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 2px rgba(214,179,106,.6)}
.brand-txt{display:block;text-align:left}
.brand b{display:block;font:800 16px/1.1 var(--f-display);letter-spacing:-.01em}
.brand-sub{display:block;font:500 11px/1.2 var(--f-body);color:rgba(255,255,255,.6);letter-spacing:.06em}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.nav .nav-home{display:flex;align-items:center;gap:8px;padding:0 14px}
.nav button{position:relative;height:36px;min-width:42px;padding:0 10px;border-radius:999px;color:rgba(255,255,255,.75);font:700 13px/1 var(--f-display);transition:color .25s,background .25s}
.nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav button.active{color:var(--navy-2);background:var(--gold)}
.nav button[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;border-radius:10px;background:#fff;color:var(--navy);font:600 12.5px/1 var(--f-body);box-shadow:var(--sh-2);pointer-events:none}
.hdr-tools{display:flex;align-items:center;gap:4px;color:#fff}
.edit-pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font:600 12px/1 var(--f-body);color:rgba(255,255,255,.8);transition:all .25s}
.edit-pill .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .25s}
.edit-pill[aria-pressed="true"]{border-color:var(--gold);color:#fff}
.edit-pill[aria-pressed="true"] .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(214,179,106,.25)}
.burger{display:none}

/* Mobile menu */
#mmenu{position:fixed;inset:0;z-index:120;background:rgba(11,31,51,.97);backdrop-filter:blur(10px);color:#fff;display:flex;flex-direction:column;padding:22px 24px 32px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
#mmenu.open{opacity:1;visibility:visible}
#mmenu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
#mmenu nav{display:flex;flex-direction:column;gap:6px;overflow:auto}
#mmenu nav button{display:flex;align-items:center;gap:16px;padding:16px 14px;border-radius:16px;text-align:left;font:700 17px/1.25 var(--f-display);transform:translateY(14px);opacity:0;transition:transform .5s var(--ease),opacity .5s,background .2s}
#mmenu.open nav button{transform:none;opacity:1}
#mmenu nav button:hover,#mmenu nav button.active{background:rgba(255,255,255,.07)}
#mmenu nav button em{font:700 12px/1 var(--f-body);font-style:normal;color:var(--gold);min-width:24px}
#mmenu .mm-foot{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:20px}

/* ---------- HERO ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;background:var(--navy-2);color:#fff;isolation:isolate}
.hero-bg{position:absolute;inset:-6% 0 -6% 0;z-index:-3}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:18% 50%;transform:scale(1.04)}
.hero-shade{position:absolute;inset:0;z-index:-2;background:
  linear-gradient(90deg,rgba(11,31,51,0) 0%,rgba(11,31,51,.10) 26%,rgba(11,31,51,.72) 46%,rgba(11,31,51,.94) 60%,#0B1F33 100%),
  linear-gradient(0deg,rgba(11,31,51,.85) 0%,rgba(11,31,51,0) 32%)}
.hero-fx{position:absolute;inset:0;z-index:-1;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:screen}
.glow.g1{width:520px;height:520px;right:-120px;top:-140px;background:radial-gradient(circle,rgba(220,238,255,.55),transparent 65%);animation:drift 14s ease-in-out infinite}
.glow.g2{width:420px;height:420px;right:24%;bottom:-160px;background:radial-gradient(circle,rgba(214,179,106,.45),transparent 65%);animation:drift 18s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(-40px,30px) scale(1.08)}}
.sweep{position:absolute;top:-20%;bottom:-20%;width:18%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-14deg);animation:sweep 9s ease-in-out infinite 2s}
@keyframes sweep{0%{left:-30%}55%,100%{left:130%}}
.geo{position:absolute;right:-4%;top:8%;width:min(54vw,820px);opacity:.22}
.geo .spin{transform-origin:300px 300px;animation:spin 60s linear infinite}
.geo .spin-r{transform-origin:300px 300px;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero > .wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,700px);align-items:center;padding-top:110px;padding-bottom:40px}
.hero-copy{grid-column:2}
.hero-kicker{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);font:600 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.hero-kicker i{display:inline-grid;place-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--gold);color:var(--navy-2);font-style:normal;font-weight:700;letter-spacing:.04em}
.hero-brand{white-space:nowrap;margin-top:24px;font:900 clamp(52px,6.3vw,134px)/.9 var(--f-display);letter-spacing:-.045em;background:linear-gradient(180deg,#fff 30%,#bcd6ef 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-brand span{background:linear-gradient(180deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-title{margin-top:22px;font:700 clamp(22px,2vw,36px)/1.2 var(--f-display);letter-spacing:-.01em;max-width:680px}
.hero-sub{margin-top:10px;font-size:clamp(17px,1.35vw,24px);color:var(--gold-2)}
.hero-intro{margin-top:18px;max-width:600px;color:rgba(255,255,255,.72);font-size:clamp(15px,1vw,18px)}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.hero-dock{position:relative;z-index:2;padding-bottom:26px}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px;border-radius:22px;background:rgba(11,31,51,.45);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.dock button{min-width:0;display:flex;align-items:center;gap:10px;padding:14px 14px;min-height:64px;border-radius:15px;text-align:left;color:rgba(255,255,255,.8);font:600 12.5px/1.25 var(--f-body);transition:background .25s,color .25s,transform .3s var(--ease)}
.dock button:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateY(-2px)}
.dock button em{font-style:normal;font:800 11px/1 var(--f-display);color:var(--gold);flex:none}
.dock button svg{flex:none;opacity:.85}
.dock button span{min-width:0;overflow-wrap:anywhere}
.scroll-cue{position:absolute;left:clamp(20px,2vw,40px);bottom:140px;display:flex;align-items:center;gap:10px;font:600 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6);writing-mode:vertical-rl}
.scroll-cue::after{content:"";width:1px;height:56px;background:linear-gradient(var(--gold),transparent);animation:cue 2s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.wrap-wide{max-width:1720px;padding-left:clamp(28px,3.4vw,64px);padding-right:clamp(28px,3.4vw,64px)}
@media (min-width:1600px){
  :root{--max:1440px}
  .hero-shade{background:
    linear-gradient(90deg,rgba(11,31,51,0) 0%,rgba(11,31,51,.08) 28%,rgba(11,31,51,.7) 47%,rgba(11,31,51,.93) 58%,#0B1F33 100%),
    linear-gradient(0deg,rgba(11,31,51,.85) 0%,rgba(11,31,51,0) 30%)}
  .hero-emblem img{width:108px;height:108px}
  .hero-emblem div{font-size:14px;max-width:400px}
  .hero-emblem b{font-size:16.5px}
  .hero-kicker{font-size:13px}
  .btn{min-height:56px;padding:0 30px;font-size:16px}
  .dock button{font-size:13.5px}
  .hdr .wrap{height:84px}
}
@media (min-width:2200px){
  .wrap-wide{max-width:2240px}
  .hero > .wrap{grid-template-columns:minmax(0,1fr) minmax(0,900px)}
  .hero-brand{font-size:clamp(134px,6.3vw,176px)}
  .hero-title{font-size:46px;max-width:880px}
  .hero-sub{font-size:29px}
  .hero-intro{font-size:21px;max-width:760px}
  .hero-emblem img{width:136px;height:136px}
  .hero-emblem div{font-size:17px;max-width:520px}
  .hero-emblem b{font-size:20px}
  .hero-kicker{font-size:15px;padding:10px 20px 10px 10px}
  .hero-kicker i{height:32px}
  .btn{min-height:66px;padding:0 36px;font-size:19px}
  .dock button{font-size:16px;min-height:78px}
  .dock button em{font-size:14px}
  .hdr .wrap{height:100px}
  .brand-mark{width:60px;height:60px}
  .brand b{font-size:20px}.brand-sub{font-size:13px}
  .nav button{height:44px;min-width:52px;font-size:15px}
}
@media (min-width:701px) and (max-height:860px){
  .hero > .wrap{padding-top:92px;padding-bottom:22px}
  .hero-emblem{margin-bottom:16px}
  .hero-emblem img{width:70px;height:70px}
  .hero-brand{margin-top:16px;font-size:clamp(52px,min(6.3vw,11.5vh),134px)}
  .hero-title{margin-top:14px}
  .hero-intro{margin-top:12px}
  .hero-cta{margin-top:22px}
  .hero-dock{padding-bottom:16px}
  .dock button{min-height:54px;padding:10px 12px}
  .scroll-cue{display:none}
}
/* ---------- Stats ---------- */
.stats{position:relative;margin-top:-1px;background:var(--navy-2);color:#fff;padding:0 0 90px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(255,255,255,.1)}
.stat{padding:38px 28px 6px;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 clamp(44px,5vw,68px)/1 var(--f-display);letter-spacing:-.04em;background:linear-gradient(180deg,#fff,#a9c7e4);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:rgba(255,255,255,.6);font-size:14px}

/* ---------- Section heads ---------- */
.sec{padding:120px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:56px;flex-wrap:wrap}
.sec-head h2{font:800 clamp(34px,4.4vw,58px)/1.02 var(--f-display);letter-spacing:-.03em;max-width:760px;margin-top:16px}
.sec-head h2 .serif{color:var(--gold);font-weight:400}
.sec-head p{max-width:400px;color:var(--muted)}

/* ---------- Direction cards ---------- */
.cards{display:grid;grid-template-columns:repeat(12,1fr);gap:22px;perspective:1400px}
.card{grid-column:span 4;position:relative;min-height:400px;border-radius:var(--r-lg);padding:30px;display:flex;flex-direction:column;color:#fff;overflow:hidden;cursor:pointer;text-align:left;
  background:var(--c-bg);box-shadow:var(--sh-1);transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s var(--ease);will-change:transform;isolation:isolate}
.card:nth-child(1),.card:nth-child(2){grid-column:span 6;min-height:440px}
.card:hover{box-shadow:0 30px 70px -20px rgba(16,42,67,.55)}
.card .motif{position:absolute;inset:0;z-index:-1;opacity:.55;transition:transform .8s var(--ease),opacity .5s}
.card:hover .motif{transform:scale(1.06);opacity:.8}
.card .motif svg{width:100%;height:100%}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(5,16,28,.55))}
.card .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.22),transparent 40%);opacity:0;transition:opacity .4s}
.card:hover .glare{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;transform:translateZ(40px)}
.card-num{font:900 64px/1 var(--f-display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,.55)}
.card-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);color:var(--c-acc)}
.card-body{margin-top:auto;transform:translateZ(50px)}
.card h3{font:800 clamp(22px,2vw,28px)/1.12 var(--f-display);letter-spacing:-.02em;max-width:440px}
.card p{margin-top:12px;color:rgba(255,255,255,.75);font-size:15px;max-width:440px}
.card-go{margin-top:22px;display:inline-flex;align-items:center;gap:10px;font:600 14px/1 var(--f-body);color:var(--c-acc)}
.card-go i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;transition:transform .4s var(--ease),background .3s,color .3s}
.card:hover .card-go i{transform:translateX(6px);background:var(--c-acc);color:var(--navy-2)}
.card-count{position:absolute;right:30px;bottom:30px;font:600 12px/1 var(--f-body);color:rgba(255,255,255,.55);transform:translateZ(30px)}

/* ---------- Goal ---------- */
.goal{background:#fff}
.goal-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:start}
.goal-quote{font:400 clamp(19px,1.6vw,23px)/1.55 var(--f-serif);font-style:italic;color:var(--navy)}
.goal-quote::first-letter{font:800 1.9em/0.8 var(--f-display);font-style:normal;color:var(--gold);float:left;margin:8px 12px 0 0}
.tasks{margin-top:38px;display:grid;gap:14px}
.task{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px;border-radius:var(--r-md);background:var(--mist);border:1px solid var(--line)}
.task b{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:var(--gold);font:800 14px/1 var(--f-display)}
.task p{font-size:15.5px;color:var(--navy)}
.pillars{display:grid;gap:16px}
.pillar-card{border-radius:var(--r-lg);padding:30px;background:linear-gradient(160deg,var(--navy),var(--navy-3));color:#fff;position:relative;overflow:hidden}
.pillar-card h4{font:700 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pillar-list{margin-top:18px;display:grid;gap:10px}
.pillar-list div{display:flex;align-items:center;gap:14px;font:700 18px/1.3 var(--f-display)}
.pillar-list div i{width:10px;height:10px;border-radius:3px;background:var(--gold);transform:rotate(45deg);flex:none}
.out-card{border-radius:var(--r-lg);padding:30px;background:var(--sky)}
.out-card h4{font:700 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--navy-3)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{padding:10px 16px;border-radius:999px;background:#fff;font:600 14px/1.2 var(--f-body);box-shadow:var(--sh-1)}

/* ---------- Footer ---------- */
.foot{background:var(--navy-2);color:rgba(255,255,255,.7);padding:70px 0 40px}
.foot-grid{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.foot h5{font:800 30px/1 var(--f-display);color:#fff;letter-spacing:-.02em}
.foot p{margin-top:12px;max-width:440px;font-size:14px}
.foot-links{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:8px 30px}
.foot-links button{text-align:left;font-size:14px;color:rgba(255,255,255,.7);padding:4px 0;transition:color .2s}
.foot-links button:hover{color:var(--gold)}
.foot-bottom{margin-top:50px;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.45)}

/* =========================================================
   SECTION PAGE
   ========================================================= */
.s-hero{position:relative;min-height:0;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--c-bg);isolation:isolate}
.s-hero .motif{position:absolute;inset:-10% 0;z-index:-2;opacity:.6}
.s-hero .motif svg{width:100%;height:100%}
.s-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(5,16,28,.75),rgba(5,16,28,0) 60%)}
.s-hero .wrap{padding-top:104px;padding-bottom:40px}
.crumbs{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--f-body);color:rgba(255,255,255,.65);flex-wrap:wrap}
.crumbs button:hover{color:#fff}
.s-hero-row{display:flex;align-items:center;gap:20px;margin-top:20px;flex-wrap:wrap}
.s-num{font:900 clamp(56px,6vw,84px)/.85 var(--f-display);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.4)}
.s-icon{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(12px);color:var(--c-acc)}
.s-title{margin-top:14px;font:800 clamp(28px,3.4vw,46px)/1.08 var(--f-display);letter-spacing:-.03em;max-width:980px}
.s-lead{margin-top:10px;max-width:720px;font-size:clamp(15.5px,1.2vw,18px);color:rgba(255,255,255,.8)}
.s-body{padding:56px 0 40px}
.s-layout{display:grid;grid-template-columns:270px 1fr;gap:56px;align-items:start}
.toc{position:sticky;top:100px;display:grid;gap:6px}
.toc h6{font:700 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.toc button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font:600 14px/1.2 var(--f-body);text-align:left;color:var(--muted);transition:background .2s,color .2s}
.toc button:hover{background:#fff;color:var(--navy)}
.toc button.on{background:#fff;color:var(--navy);box-shadow:var(--sh-1)}
.toc button span{min-width:26px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--sky);font-size:11px;color:var(--navy)}
.toc-note{margin-top:16px;padding:14px;border-radius:14px;background:#fff;border:1px dashed rgba(16,42,67,.2);font-size:12.5px;color:var(--muted);line-height:1.5}
.block{scroll-margin-top:100px;margin-bottom:64px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.block-head h3{display:flex;align-items:center;gap:14px;font:800 clamp(21px,2.1vw,26px)/1.2 var(--f-display);letter-spacing:-.02em;max-width:900px}
.block-head h3 i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:var(--gold);flex:none}
.block-head h3 small{font:600 13px/1 var(--f-body);color:var(--muted);letter-spacing:0}
.about{background:#fff;border-radius:var(--r-lg);padding:40px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.about::before{content:"";position:absolute;left:0;top:40px;bottom:40px;width:4px;border-radius:0 4px 4px 0;background:var(--c-acc2)}
.about .lead{font:400 clamp(21px,2vw,26px)/1.45 var(--f-serif);font-style:italic}
.about .txt{margin-top:18px;display:grid;gap:14px;color:#2c4257;font-size:16.5px;max-width:760px}
.about .txt h5{margin-top:8px;font:700 17px/1.35 var(--f-display);color:var(--navy)}
.about .res{margin-top:26px;padding:22px;border-radius:18px;background:var(--mist);border:1px solid var(--line)}
.about .res h6{font:700 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#9a7536;margin-bottom:14px}
.about .res ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.about .res li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;font:600 14px/1.4 var(--f-body);color:var(--navy);box-shadow:var(--sh-1)}
.about .res li svg{flex:none;margin-top:1px;color:#b08a3c}
@media (max-width:700px){.about .res ul{grid-template-columns:1fr}}
.about .ctx{margin-top:26px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.about .ctx b{color:var(--navy)}
.grid-media{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.m-item{position:relative;border-radius:var(--r-md);overflow:hidden;background:#dfe8f2;aspect-ratio:4/3;cursor:zoom-in;box-shadow:var(--sh-1);transition:transform .45s var(--ease),box-shadow .45s}
.m-item:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.m-item img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.m-item:hover img{transform:scale(1.06)}
.m-item .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;background:linear-gradient(0deg,rgba(5,16,28,.75),transparent);color:#fff;font:600 13.5px/1.3 var(--f-body);opacity:0;transform:translateY(8px);transition:all .35s var(--ease)}
.m-item:hover .cap,.m-item:focus-visible .cap{opacity:1;transform:none}
.m-item.video{cursor:pointer;background:var(--navy)}
.m-item.video video{width:100%;height:100%;object-fit:cover;opacity:.75}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play i{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:var(--navy);box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .35s var(--ease)}
.m-item.video:hover .play i{transform:scale(1.1)}
.m-item.video .cap{opacity:1;transform:none}
.del{position:absolute;top:10px;right:10px;z-index:3;height:34px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:6px;background:rgba(11,31,51,.75);color:#fff;font:600 12px/1 var(--f-body);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s,background .2s}
.m-item:hover .del,.link-card:hover .del,.del.confirm,.del:focus-visible{opacity:1}
.del.confirm{background:#c0392b}
@media (hover:none){.del{opacity:1}}
.embed{margin:0 0 22px}
.embed-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.embed-head h4{font:800 clamp(19px,1.8vw,24px)/1.25 var(--f-display);letter-spacing:-.01em;max-width:760px}
.embed-frame{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--navy-2);box-shadow:var(--sh-2);height:min(86vh,920px)}
.embed-frame iframe{display:block;width:100%;height:100%;border:0}
.embed-frame:fullscreen{border-radius:0;height:100%}
/* мұражай каталогы */
.mz{display:grid;gap:26px}
#lightbox{z-index:175}
.mz-hero{display:flex;gap:30px;align-items:center;padding:34px;border-radius:var(--r-xl);background:linear-gradient(150deg,var(--navy-2),var(--navy-3));color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-2)}
.mz-hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(214,179,106,.28),transparent 65%)}
.mz-logo{width:132px;height:132px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(214,179,106,.8),0 18px 40px rgba(0,0,0,.4)}
.mz-lead{margin-top:12px;font:400 clamp(24px,2.6vw,36px)/1.2 var(--f-serif);font-style:italic;color:#fff}
.mz-hero p{margin:12px 0 20px;color:rgba(255,255,255,.75);max-width:640px}
.mz-part{background:#fff;border-radius:var(--r-lg);padding:30px;box-shadow:var(--sh-1);scroll-margin-top:100px}
.mz-part h4{margin-top:8px;font:800 24px/1.2 var(--f-display);letter-spacing:-.01em}
.mz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.mz-search{flex:1 1 320px;max-width:460px;display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:14px;background:var(--mist);border:1px solid var(--line);color:var(--muted);transition:border-color .2s,background .2s}
.mz-search:focus-within{border-color:var(--navy);background:#fff}
.mz-search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;color:var(--navy)}
.mz-count{margin:16px 0 18px;color:var(--muted);font-size:14px}
.mz-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.mz-card{display:flex;flex-direction:column;text-align:left;border-radius:18px;overflow:hidden;background:var(--mist);border:1px solid var(--line);transition:transform .4s var(--ease),box-shadow .4s,border-color .3s}
.mz-card:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:transparent}
.mz-ph{position:relative;display:block;aspect-ratio:4/3;background:#e9e3d4;overflow:hidden}
.mz-ph img{width:100%;height:100%;object-fit:contain;transition:transform .7s var(--ease)}
.mz-card:hover .mz-ph img{transform:scale(1.06)}
.mz-ph em{position:absolute;left:10px;top:10px;padding:5px 9px;border-radius:999px;background:rgba(11,31,51,.8);color:var(--gold-2);font:700 11px/1 var(--f-body);font-style:normal;letter-spacing:.06em}
.mz-nophoto{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--muted)}
.mz-cb{display:flex;flex-direction:column;gap:8px;padding:16px;flex:1}
.mz-cb b{font:700 15.5px/1.3 var(--f-display);color:var(--navy)}
.mz-cb span{font-size:13.5px;color:var(--muted);line-height:1.5}
.mz-cb i{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);font-style:normal;color:#9a7536}
.mz-two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.mz-wait{margin-top:16px;display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:16px;background:var(--sky);color:var(--navy)}
.mz-wait p{margin-top:6px;font-size:14.5px;color:#2c4257}
.mz-chron{list-style:none;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mz-chron li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--mist);font:600 14px/1.3 var(--f-body)}
.mz-chron em{font:800 12px/1 var(--f-display);font-style:normal;color:#9a7536}
.mz-motto{margin-top:16px;font:400 16px/1.5 var(--f-serif);font-style:italic;color:#2c4257}
.mz-box{width:min(940px,94vw)}
.mz-gal{display:grid;gap:12px;margin-bottom:22px}
.mz-gal.two{grid-template-columns:1fr 1fr}
.mz-gal button{position:relative;border-radius:16px;overflow:hidden;background:#ece6d8;cursor:zoom-in}
.mz-gal img{width:100%;max-height:440px;object-fit:contain;display:block}
.mz-gal span{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(11,31,51,.75);color:#fff}
.mz-text{display:grid;gap:12px;font-size:16px;line-height:1.7;color:#2c4257}
@media (max-width:1100px){.mz-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.mz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mz-two{grid-template-columns:1fr}.mz-hero{flex-direction:column;align-items:flex-start;padding:26px}.mz-logo{width:96px;height:96px}}
@media (max-width:520px){.mz-grid{grid-template-columns:1fr}.mz-chron{grid-template-columns:1fr}.mz-gal.two{grid-template-columns:1fr}.mz-part{padding:22px}}
.shelf-hint{display:flex;align-items:center;gap:10px;margin:-6px 0 26px;color:var(--muted);font-size:14.5px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:44px 30px;perspective:1600px;padding:6px 14px 0 4px}
.bk{display:flex;flex-direction:column;gap:20px;text-align:left}
.bk-3d{position:relative;display:block;aspect-ratio:595/842;border-radius:3px 8px 8px 3px;transform:rotateY(-16deg);transform-origin:left center;transition:transform .6s var(--ease),box-shadow .6s var(--ease);
  box-shadow:5px 5px 0 -1px #f6f2e8,6px 6px 0 -1px #cbc4b2,10px 10px 0 -1px #f6f2e8,11px 11px 0 -1px #cbc4b2,0 30px 40px -12px rgba(16,42,67,.5)}
.bk-3d img{width:100%;height:100%;object-fit:cover;border-radius:3px 8px 8px 3px}
.bk-3d::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.35) 45%,rgba(0,0,0,.12));z-index:1}
.bk-3d::after{content:"";position:absolute;inset:0;border-radius:3px 8px 8px 3px;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 40%);pointer-events:none}
.bk:hover .bk-3d,.bk:focus-visible .bk-3d{transform:rotateY(-4deg) translateY(-10px) scale(1.03);box-shadow:5px 5px 0 -1px #f6f2e8,6px 6px 0 -1px #cbc4b2,10px 10px 0 -1px #f6f2e8,11px 11px 0 -1px #cbc4b2,0 44px 60px -14px rgba(16,42,67,.55)}
.bk-open{position:absolute;left:50%;bottom:16px;z-index:2;transform:translate(-50%,10px);opacity:0;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--navy);color:#fff;font:600 13px/1 var(--f-body);box-shadow:0 10px 24px rgba(0,0,0,.3);transition:all .4s var(--ease)}
.bk:hover .bk-open,.bk:focus-visible .bk-open{opacity:1;transform:translate(-50%,0)}
.bk-meta small{display:block;font:700 11px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#b08a3c}
.bk-meta b{display:block;margin-top:6px;font:800 16px/1.28 var(--f-display);color:var(--navy)}
.bk-meta span{display:block;margin-top:6px;font-size:13.5px;color:#2c4257}
.bk-meta span i{font-style:normal;white-space:nowrap}
.bk-meta em{display:block;margin-top:4px;font:600 12.5px/1.2 var(--f-body);font-style:normal;color:var(--muted)}
#bookModal .br-bg{background:radial-gradient(ellipse at 50% 40%,#1d3c5e 0%,#0B1F33 60%,#050e19 100%);backdrop-filter:none}
.br-top{position:absolute;top:0;left:0;right:0;height:66px;z-index:3;display:flex;align-items:center;gap:6px;padding:0 14px 0 20px;color:#fff;background:linear-gradient(180deg,rgba(5,14,25,.6),transparent)}
.br-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:var(--navy-2);flex:none;margin-right:8px}
.br-t{flex:1;min-width:0}
.br-t b{display:block;font:700 15.5px/1.25 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-t small{display:block;color:rgba(255,255,255,.6);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-stage{position:absolute;top:66px;bottom:74px;left:0;right:0;z-index:1;display:grid;place-items:center;overflow:hidden}
.br-stage.loading .br-zoom,.br-stage.loading .br-arrow{visibility:hidden}
.br-stage.loading::after{content:"Кітап ашылуда…";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 26px 16px 56px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;font:600 14px/1 var(--f-body);
  background-image:radial-gradient(circle at 30px 50%,var(--gold) 6px,transparent 7px);animation:brPulse 1.1s ease-in-out infinite}
@keyframes brPulse{50%{opacity:.55}}
.br-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;max-width:320px}
.br-zoom{transition:transform .45s var(--ease)}
.br-stage.zoom .br-zoom{transform:scale(1.9)}
.br-stage.zoom{cursor:zoom-out}
.br-book{position:relative;perspective:2600px;transition:transform .7s var(--ease);cursor:pointer;user-select:none}
.br-page{position:absolute;top:0;height:100%;width:50%;background:#fbf9f3;overflow:hidden;box-shadow:0 30px 60px -10px rgba(0,0,0,.55)}
.br-page.left{left:0;border-radius:6px 0 0 6px}
.br-page.right{left:50%;border-radius:0 6px 6px 0}
.br-page.solo{left:0;width:100%;border-radius:6px}
.br-page.blank{background:transparent;box-shadow:none}
.br-page img,.br-face img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.br-page::after{content:"";position:absolute;inset:0;pointer-events:none}
.br-page.left:not(.blank)::after{background:linear-gradient(90deg,transparent 82%,rgba(0,0,0,.22))}
.br-page.right:not(.blank)::after{background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 18%)}
.br-page.solo::after{background:linear-gradient(90deg,rgba(0,0,0,.14),transparent 8%)!important}
.br-spine{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(0,0,0,.3);z-index:2}
.br-leaf{position:absolute;top:0;height:100%;width:50%;z-index:5;transform-style:preserve-3d;transition:transform .74s cubic-bezier(.45,.05,.25,1)}
.br-leaf.fwd{left:50%;transform-origin:0 50%}
.br-leaf.bwd{left:0;transform-origin:100% 50%}
.br-leaf.solo{left:0;width:100%;transform-origin:0 50%}
.br-leaf.fwd.turn,.br-leaf.solo.turn{transform:rotateY(-180deg)}
.br-leaf.bwd.turn{transform:rotateY(180deg)}
.br-face{position:absolute;inset:0;overflow:hidden;background:#fbf9f3;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.br-face.back{transform:rotateY(180deg)}
.br-face.paper{background:linear-gradient(90deg,#efe9da,#fbf9f3)}
.br-face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .37s ease}
.br-leaf.fwd .br-face.front::after,.br-leaf.solo .br-face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 60%)}
.br-leaf.bwd .br-face.front::after{background:linear-gradient(270deg,rgba(0,0,0,.3),transparent 60%)}
.br-leaf.turn .br-face::after{opacity:1}
.br-curl{position:absolute;top:0;z-index:6;transform-style:preserve-3d;pointer-events:none}
.br-strip{position:absolute;top:0;transform-style:preserve-3d;will-change:transform}
.sf{position:absolute;inset:0;background-color:#fbf9f3;background-repeat:no-repeat;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sf.back{transform:rotateY(180deg)}
.sf.paper{background:linear-gradient(90deg,#efe9da,#fbf9f3)}
.sf i{position:absolute;inset:0;pointer-events:none}
.br-book.enter{animation:bookIn .75s cubic-bezier(.22,1,.36,1)}

.out-card .vals{margin-top:14px;font-size:14.5px;line-height:1.65;color:#486581}
.mz-tour{grid-column:1/-1}.tour-link{margin-top:16px;display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:20px;background:linear-gradient(135deg,var(--navy-2),var(--navy-3));color:#fff;box-shadow:var(--sh-1);transition:transform .35s var(--ease),box-shadow .35s}.tour-link:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}.tl-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:rgba(214,179,106,.18);color:var(--gold)}.tl-tx{flex:1;min-width:0}.tl-tx b{display:block;font:800 18px/1.25 var(--f-display)}.tl-tx small{display:block;margin-top:4px;font-size:14px;color:rgba(255,255,255,.72)}.tl-go{flex:none}@media (max-width:700px){.tour-link{flex-wrap:wrap}.tl-go{width:100%;justify-content:center}}
/* ===== LIGHT SKY THEME ===== */
:root{--ink:#0A2540;--ink-2:#26445F;--blue:#1569C7;--blue-2:#2E9BE6;--bg:#EEF6FF;--gold-ink:#A8761C;--muted:#3E5A74}
body{background:var(--bg);color:var(--ink);font-weight:500}
p{font-weight:500}
.eyebrow{color:var(--blue);font-weight:800}
.sec-head h2 .serif,.goal-quote::first-letter{color:var(--blue)}
.btn-glass{background:#fff;color:var(--ink);border:1.5px solid #BFDcf5;box-shadow:0 6px 18px rgba(21,105,199,.10)}
.btn-glass:hover{background:#F3F9FF}
.btn-navy{background:var(--blue)}.btn-navy:hover{background:#0F57A8}
/* loader + curtain */
#loader{background:linear-gradient(160deg,#F4FAFF,#DCEEFF)}
.ld-mark{background:linear-gradient(90deg,var(--ink) 0%,var(--blue) 50%,var(--ink) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text}
.ld-sub,.ld-pct{color:#4A6680}
.ld-bar{background:rgba(10,37,64,.12)!important}.ld-bar i{background:var(--blue)}
#curtain{background:#DCEEFF}#curtain::after{background:linear-gradient(90deg,transparent,var(--blue),transparent)}
/* header */
.hdr.solid{background:rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(10,37,64,.08),0 8px 24px rgba(21,105,199,.06)}
.brand{color:var(--ink)}.brand-sub{color:#4A6680}
.nav{background:#fff;border:1px solid #D3E6F7;box-shadow:0 4px 14px rgba(21,105,199,.08)}
.nav button{color:var(--ink-2)}.nav button:hover{color:var(--ink);background:#EAF4FF}
.nav button.active{background:var(--blue);color:#fff}
.hdr-tools{color:var(--ink)}
#mmenu{background:rgba(243,249,255,.98);color:var(--ink)}
#mmenu nav button:hover,#mmenu nav button.active{background:#DCEEFF}
#mmenu nav button em{color:var(--blue)}
/* hero */
.hero{background:var(--bg);color:var(--ink)}
.hero-shade{background:
  linear-gradient(90deg,rgba(238,246,255,0) 0%,rgba(238,246,255,.12) 26%,rgba(238,246,255,.82) 45%,rgba(238,246,255,.97) 57%,#EEF6FF 100%),
  linear-gradient(0deg,rgba(238,246,255,.95) 0%,rgba(238,246,255,0) 30%)!important}
.sweep,.geo{opacity:.0}
.glow.g1{background:radial-gradient(circle,rgba(46,155,230,.35),transparent 65%);mix-blend-mode:multiply;opacity:.35}
.glow.g2{background:radial-gradient(circle,rgba(214,179,106,.35),transparent 65%);mix-blend-mode:multiply;opacity:.3}
.hero-emblem div{color:var(--ink-2);font-weight:600}.hero-emblem b{color:var(--ink)}
.hero-kicker{background:#fff;border:1.5px solid #C9E1F6;color:var(--blue);font-weight:800;backdrop-filter:none}
.hero-name{color:var(--ink)}
.hero-name span{background:linear-gradient(100deg,var(--blue),var(--blue-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-intro{color:var(--ink-2);font-weight:500}
.dock{background:rgba(255,255,255,.92);border:1px solid #D3E6F7;box-shadow:0 14px 40px rgba(21,105,199,.12)}
.dock button{color:var(--ink);font-weight:700}.dock button:hover{background:#EAF4FF;color:var(--ink)}
.dock button em{color:var(--blue)}
.scroll-cue{color:#4A6680}
/* stats */
.stats{background:var(--bg);color:var(--ink)}
.stats-grid{border-top:1px solid rgba(10,37,64,.12)}
.stat{border-right:1px solid rgba(10,37,64,.10)}
.stat b{background:linear-gradient(180deg,var(--ink),var(--blue));-webkit-background-clip:text;background-clip:text}
.stat span{color:var(--muted);font-weight:600}
/* direction cards */
.card{background:linear-gradient(165deg,#FFFFFF 0%,#E4F1FF 100%)!important;color:var(--ink);border:1px solid #D3E6F7;box-shadow:0 10px 30px rgba(21,105,199,.08)}
.card:hover{box-shadow:0 30px 60px -20px rgba(21,105,199,.35)}
.card::before{display:none}
.card .motif{opacity:.10;filter:invert(1) hue-rotate(180deg)}.card:hover .motif{opacity:.16}
.card-num{-webkit-text-stroke:1.4px rgba(21,105,199,.45)}
.card-icon{background:#DCEEFF;border:1px solid #BFDcf5;color:var(--blue)}
.card p{color:var(--muted);font-weight:500}
.card-go{color:var(--blue);font-weight:700}
.card:hover .card-go i{background:var(--blue);color:#fff}
.card-count{color:#4A6680}
/* goal */
.goal{background:#fff}
.task{background:#F3F9FF;border-color:#D3E6F7}
.task b{background:var(--blue);color:#fff}
.task p{color:var(--ink);font-weight:600}
.goal-quote{color:var(--ink)}
.pillar-card{background:linear-gradient(160deg,#DCEEFF,#F3F9FF);color:var(--ink);border:1px solid #C9E1F6}
.pillar-card h4{color:var(--blue)}
.pillar-card .idea{color:var(--ink)}
/* footer */
.foot{background:#DCEEFF;color:var(--ink-2)}
.foot h5{color:var(--ink)}
.foot-links button{color:var(--ink-2);font-weight:600}.foot-links button:hover{color:var(--blue)}
.foot-bottom{border-top:1px solid rgba(10,37,64,.12);color:#4A6680}
/* section page */
.s-hero{background:linear-gradient(160deg,#F4FAFF 0%,#D6EAFE 100%)!important;color:var(--ink)}
.s-hero::after{display:none}
.s-hero .motif{opacity:.12;filter:invert(1) hue-rotate(180deg)}
.crumbs{color:#4A6680}.crumbs button:hover{color:var(--blue)}
.s-num{-webkit-text-stroke:1.6px rgba(21,105,199,.5)}
.s-icon{background:#fff;border:1px solid #BFDcf5;color:var(--blue)}
.s-lead{color:var(--ink-2);font-weight:500}
.toc button{color:var(--ink-2)}.toc button.on,.toc button:hover{color:var(--ink)}
.toc button span{background:#DCEEFF;color:var(--blue);font-weight:700}
.block-head h3 i{background:var(--blue);color:#fff}
.about p{color:var(--ink-2)}
/* museum + portals + modal */
.mz-hero{background:linear-gradient(150deg,#FFFFFF,#DCEEFF);color:var(--ink);border:1px solid #C9E1F6;box-shadow:0 14px 40px rgba(21,105,199,.10)}
.mz-hero p,.mz-hero p:first-of-type{color:var(--ink-2)}
.mz-hero .mz-lead{color:var(--blue)}
.mz-ghost{color:var(--ink)!important;border:1.5px solid #BFDcf5!important;background:#fff!important}
.tour-link{background:linear-gradient(135deg,#FFFFFF,#DCEEFF);color:var(--ink);border:1px solid #C9E1F6}
.portal{background:linear-gradient(150deg,#FFFFFF,#DCEEFF)!important;color:var(--ink);border:1px solid #C9E1F6}
.portal .motif{opacity:.12;filter:invert(1) hue-rotate(180deg)}
.portal-ic{background:#DCEEFF;border-color:#BFDcf5;color:var(--blue)}
.portal-tags span{background:#fff;border-color:#C9E1F6;color:var(--ink)}
.pr-head{background:linear-gradient(135deg,#F4FAFF,#D6EAFE);color:var(--ink)}
.pr-head p{color:var(--ink-2)}
#toast{background:var(--blue)}
.pg{background:linear-gradient(150deg,#FFFFFF,#DCEEFF)!important;color:var(--ink);border:1px solid #C9E1F6}
.pg .motif{opacity:.1;filter:invert(1) hue-rotate(180deg)}
.pg::before,.pg::after{background:none!important}
.pg small{color:var(--blue)}.pg em{-webkit-text-stroke:1.2px rgba(21,105,199,.45)}
.route .rn{background:#DCEEFF;color:var(--blue)}

@media (max-width:700px){.hero-shade{background:linear-gradient(0deg,#EEF6FF 0%,rgba(238,246,255,.95) 48%,rgba(238,246,255,.55) 78%,rgba(238,246,255,.25) 100%)!important}}
.sl-list{display:grid;gap:34px}
.sl-item{background:#fff;border:1px solid #D3E6F7;border-radius:var(--r-lg);padding:24px;box-shadow:0 10px 30px rgba(21,105,199,.08)}
.sl-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.sl-head em{font:900 34px/1 var(--f-display);font-style:normal;color:transparent;-webkit-text-stroke:1.3px rgba(21,105,199,.55);flex:none}
.sl-head h4{font:800 clamp(19px,1.8vw,24px)/1.2 var(--f-display);color:var(--ink,#0A2540);letter-spacing:-.01em}
.sl-head p{margin-top:6px;color:var(--blue,#1569C7);font-weight:700;font-size:15px}
.sl-img{position:relative;display:block;width:100%;border-radius:16px;overflow:hidden;cursor:zoom-in;box-shadow:0 8px 24px rgba(10,37,64,.15)}
.sl-img img{display:block;width:100%;height:auto;transition:transform .6s var(--ease)}
.sl-img:hover img{transform:scale(1.02)}
.sl-img span{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#0A2540;font:700 13px/1 var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (max-width:700px){.sl-item{padding:14px}.sl-head em{font-size:26px}}
</style>
</head>

      for(let l=0;l<11;l++){const w=150-((l*37)%60);s+=`<path d="M${x+24} ${y+40+l*20}h${w}" stroke="${l%4==0?a:'rgba(255,255,255,.28)'}" stroke-opacity="${l%4==0?.6:1}"/>`;}
      s+='</g>';});
    for(let l=0;l<14;l++)s+=`<path d="M40 ${80+l*34}h${200+((l*53)%160)}" stroke="rgba(255,255,255,.08)" stroke-width="6" stroke-linecap="round"/>`;

  wire(a){ // изометриялық сым-торлы модельдер

    let s=cube(560,280,190,a+'aa')+cube(560,280,120,'rgba(255,255,255,.28)')+cube(180,420,70,'rgba(255,255,255,.2)')+cube(720,90,50,'rgba(255,255,255,.2)');

    let s=''; for(let x=0;x<=800;x+=50)s+=`<path d="M${x} 0V600" stroke="rgba(255,255,255,.06)"/>`;

    for(let i=1;i<8;i++)s+=`<path d="M${520-i*40} 260c${i*30} -${i*40} ${i*90} -${i*30} ${i*95} ${i*15}s-${i*20} ${i*60} -${i*80} ${i*55}s-${i*40} -${i*45} -${i*15} -${i*70}" stroke="${i%3==0?a:'rgba(255,255,255,.18)'}" stroke-opacity="${i%3==0?.55:1}" fill="none"/>`;
    [[300,180],[610,330],[470,430],[170,350]].forEach(([x,y])=>{s+=`<circle cx="${x}" cy="${y}" r="22" fill="${a}" fill-opacity=".12"/><circle cx="${x}" cy="${y}" r="6" fill="${a}"/>`;});
    return s+`<path d="M170 350 300 180 470 430 610 330" stroke="${a}" stroke-dasharray="6 8" fill="none" stroke-opacity=".7"/>`;

  film(a){ // кинолента және дыбыс толқыны

    for(let i=0;i<24;i++){s+=`<rect x="${-30+i*38}" y="132" width="20" height="14" rx="3" fill="rgba(255,255,255,.2)"/><rect x="${-30+i*38}" y="294" width="20" height="14" rx="3" fill="rgba(255,255,255,.2)"/>`;}
    for(let f=0;f<6;f++)s+=`<rect x="${-10+f*150}" y="160" width="130" height="120" rx="6" stroke="${f==3?a:'rgba(255,255,255,.22)'}" fill="none"/>`;
    s+='</g>'; let w='M0 470';
    for(let x=0;x<=800;x+=10){const h=Math.sin(x/23)*Math.cos(x/71)*48;w+=` L${x} ${470+h}`;}
    return s+`<path d="${w}" stroke="${a}" stroke-opacity=".6" fill="none"/>`;

    hs.forEach((h,i)=>{s+=`<circle cx="${127+i*62}" cy="${500-h}" r="5" fill="${a}"/>`;});
    for(let i=0;i<5;i++)s+=`<path d="M80 ${120+i*100}H760" stroke="rgba(255,255,255,.05)"/>`;

/* =========================================================================
   4. STORE — материалдарды браузерде сақтау (IndexedDB)
   ========================================================================= */
const Store = {
  db:null, mem:[], persistent:false, urls:new Map(),
  async init(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open("expo225", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("media", { keyPath:"id" });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.mem = await new Promise((res,rej)=>{
        const q = this.db.transaction("media").objectStore("media").getAll();
        q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error);
      });
      this.persistent = true;
    }catch(e){ this.db = null; this.persistent = false; }
  },
  async add(rec){
    this.mem.push(rec);
    if(this.db){ try{ await new Promise((res,rej)=>{const t=this.db.transaction("media","readwrite");t.objectStore("media").put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error);}); }catch(e){ toast("Браузер жадына сақталмады — материал тек осы сеанста көрінеді"); } }
  },
  async remove(id){
    this.mem = this.mem.filter(r => r.id !== id);
    if(this.urls.has(id)){ URL.revokeObjectURL(this.urls.get(id)); this.urls.delete(id); }
    if(this.db){ try{ await new Promise((res)=>{const t=this.db.transaction("media","readwrite");t.objectStore("media").delete(id);t.oncomplete=res;t.onerror=res;}); }catch(e){} }
  },
  url(rec){ if(!rec.blob) return rec.url; if(!this.urls.has(rec.id)) this.urls.set(rec.id, URL.createObjectURL(rec.blob)); return this.urls.get(rec.id); },
  of(secId, kind){ return this.mem.filter(r => r.sec === secId && r.kind === kind).sort((a,b)=>a.ts-b.ts); }
};

/* Бір бөлімнің бір түрдегі материалдарын біріктіру: DATA + қосылғандар */
const KIND_MAP = { photo:"photos", video:"videos", info:"infographics", link:"interactive", book:"projects", bookz:"zhanqozha", bookm:"mektep", slide:"slides", museum:"museum" };
function items(sec, kind){
  const base = (sec[KIND_MAP[kind]] || []).map((x,i)=>({ ...x, id:`d-${sec.id}-${kind}-${i}`, fixed:true }));
  const added = Store.of(sec.id, kind).map(r => kind==="link"
    ? { id:r.id, title:r.title, url:r.url, embed:r.embed }
    : { id:r.id, src:Store.url(r), caption:r.caption });
  return [...base, ...added];
}
/* Бөлімде бір ғана кірістірілген материал болса, блок атауы — сол материалдың атауы */
const blockItems = (b, sec) => { const l = items(sec, b.kind); return b.sub != null ? [l[b.sub]] : l; };
const blockId = b => `blk-${b.kind}${b.sub != null ? "-" + b.sub : ""}`;
/* sec.splitLinks: әр интерактив материал жеке бөлімше болып шығады */
const visibleBlocks = sec => {
  let v = BLOCKS.filter(b => items(sec,b.kind).length);
  if(!v.length) v = BLOCKS.filter(b => b.kind==="link");
  if(sec.splitLinks) v = v.flatMap(b => b.kind==="link" && items(sec,"link").length > 1 ? items(sec,"link").map((_, i) => ({ ...b, sub:i })) : [b]);
  return v;
};
const blockTitle = (b, sec) => { const l = blockItems(b, sec); return (b.kind==="link" && l.length===1) ? l[0].title : (b.kind==="link" && sec.linkTitle) ? sec.linkTitle : b.title; };
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };
const countAll = sec => ["photo","video","info","link"].reduce((n,k)=>n+items(sec,k).length,0);

/* =========================================================================
   7. ROUTER + PAGE TRANSITIONS
   ========================================================================= */
function parseRoute(){ const h = location.hash.slice(1); return secById(h) ? h : "home"; }
let first = true, busy = false;
async function render(){
  const route = parseRoute();
  if(route === S.route && !first) return;
  const curtain = $("#curtain");
  const animate = !first && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(animate){ busy = true; curtain.className="in"; await wait(460); }
  closeAll();
  S.route = route;
  const app = $("#app");
  if(route === "home"){
    app.innerHTML = Hero() + Stats() + Directions() + Goal() + Footer();
    document.title = `${DATA.school.brand} · ${DATA.school.kicker}`;
  } else {
    const idx = DATA.sections.findIndex(s => s.id === route), sec = DATA.sections[idx];
    app.innerHTML = SectionPage(sec, idx);
    document.title = `${sec.num}. ${sec.title} · ${DATA.school.brand}`;
  }
  renderChrome();
  window.scrollTo({ top:0, behavior:"instant" in window ? "instant" : "auto" });
  bindPage();
  if(animate){ curtain.className="out"; await wait(560); curtain.className=""; busy=false; }
  first = false;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function go(id){
  if(id === "home"){ if(location.hash){ history.pushState(null,"",location.pathname+location.search); render(); } else { window.scrollTo({top:0,behavior:"smooth"}); } return; }
  if(location.hash.slice(1) === id){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  location.hash = id;
}
window.addEventListener("hashchange", render);
window.addEventListener("popstate", () => { if(parseRoute()!==S.route) render(); });

function renderChrome(){
  $("#hdr").innerHTML = Header();
  $("#mmenu").innerHTML = MobileMenu();
  onScroll();
}

/* =========================================================================
   8. INTERACTIONS
   ========================================================================= */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act],[data-jump],[data-add],[data-del],[data-lb],[data-video],[data-close],[data-embedfs],[data-mz],[data-mzimg],[data-mzjump],[data-mztab],[data-slide],[data-book],[data-br],[data-vi],[data-vtfs],[data-linkform],[data-linkcancel],#editToggle,#fsToggle,#burger,#mmClose,[data-lbact]");
  if(!t || busy) return;
  if(t.dataset.go){ e.preventDefault(); closeMenu(); closeModal("#programModal"); go(t.dataset.go); return; }
  const act = t.dataset.act;
  if(act==="start"){ const el=$("#expo"); if(el) el.scrollIntoView({behavior:"smooth"}); else go(DATA.sections[0].id); return; }
  if(act==="program"){ closeMenu(); openProgram(); return; }
  if(act==="top"){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.dataset.jump){ $("#"+t.dataset.jump)?.scrollIntoView({behavior:"smooth"}); $$(".toc button").forEach(b=>b.classList.toggle("on",b===t)); return; }
  if(t.id==="editToggle"){ S.editMode=!S.editMode; try{localStorage.setItem("expo225-edit",S.editMode?"1":"0");}catch(_){} rerenderKeepScroll(); toast(S.editMode?"Өңдеу режимі қосылды":"Көрме режимі: өңдеу батырмалары жасырылды"); return; }
  if(t.id==="fsToggle"){ toggleFs(); return; }
  if(t.id==="burger"){ openMenu(); return; }
  if(t.id==="mmClose"){ closeMenu(); return; }
  if(t.dataset.add){ pickFiles(t.dataset.add, t.dataset.accept); return; }
  if(t.dataset.del){ e.stopPropagation();
    if(!t.classList.contains("confirm")){ t.classList.add("confirm"); t.innerHTML=`${ic("trash",14)} Растау`; setTimeout(()=>{ if(t.isConnected){t.classList.remove("confirm"); t.innerHTML=`${ic("trash",14)} Жою`;} },3000); return; }
    await Store.remove(t.dataset.del); rerenderKeepScroll(); toast("Материал жойылды"); return; }
  if(t.dataset.lb){ openLightbox(t.dataset.lb, +t.dataset.i); return; }
  if(t.dataset.video!==undefined){ openVideo(+t.dataset.video); return; }
  if(t.dataset.mz){ mzOpen(t.dataset.mz); return; }
  if(t.dataset.mzimg!==undefined){ const x = MZ.cur; if(x) openLightboxWith(x.images.map(im=>({src:im.src, caption:x.title})), +t.dataset.mzimg); return; }
  if(t.dataset.slide!=null){ const L=items(secById(S.route),"slide"); openLightboxWith(L.map(x=>({src:x.src, caption:x.title})), +t.dataset.slide); return; }
  if(t.dataset.mztab!=null){ const n=+t.dataset.mztab, box=t.closest(".mz-about"); if(!box||isNaN(n)) return;
    $$("[data-mzpage]",box).forEach(p=>p.hidden = +p.dataset.mzpage!==n);
    $$(".mz-tabs [data-mztab]",box).forEach(b=>b.classList.toggle("on", +b.dataset.mztab===n));
    if(!t.closest(".mz-tabs")) box.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.mzjump){ $("#"+t.dataset.mzjump)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(t.dataset.book!==undefined){ openBook(+t.dataset.book, t.dataset.bkind || "book"); return; }
  if(t.dataset.br){ brAction(t.dataset.br); return; }
  if(t.dataset.vi!==undefined){ vtSelect(t, +t.dataset.vi); return; }
  if(t.dataset.vtfs!==undefined){ toggleFs(t.closest(".vt-screen").querySelector("video")); return; }
  if(t.dataset.close!==undefined){ if(t.closest("#lightbox") && $("#mzModal").classList.contains("open")) closeModal("#lightbox"); else closeAll(); return; }
  if(t.dataset.linkform!==undefined){ const f=$("[data-linkform-box]"); f.hidden=false; f.querySelector("input").focus(); return; }
  if(t.dataset.linkcancel!==undefined){ const f=$("[data-linkform-box]"); f.reset(); f.hidden=true; return; }
  if(t.dataset.lbact){ lbAction(t.dataset.lbact); return; }
  if(t.dataset.embedfs!==undefined){ toggleFs(t.closest(".embed").querySelector(".embed-frame")); return; }
});
document.addEventListener("keydown", e => {
  if(e.key==="Enter" || e.key===" "){ const t=e.target.closest?.("[data-lb],[data-video]"); if(t){ e.preventDefault(); t.click(); } }
  if(e.key==="Escape"){ closeAll(); closeMenu(); }
  if($("#bookModal").classList.contains("open")){ if(e.key==="ArrowRight"){ e.preventDefault(); brGo(1); } if(e.key==="ArrowLeft"){ e.preventDefault(); brGo(-1); } }
  if($("#lightbox").classList.contains("open")){ if(e.key==="ArrowRight") lbAction("next"); if(e.key==="ArrowLeft") lbAction("prev"); }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-linkform-box]"); if(!f) return;
  e.preventDefault();
  const title=f.title.value.trim(); let url=f.url.value.trim(); const err=f.querySelector(".form-err");
  if(url && !/^https?:\/\//i.test(url)) url = "https://" + url;
  let ok=false; try{ const u=new URL(url); ok=/^https?:$/.test(u.protocol) && u.hostname.includes("."); }catch(_){}
  if(!title || !ok){ err.hidden=false; err.textContent = !title ? "Атауын жазыңыз." : "Сілтеме дұрыс емес. Мысалы: https://claude.ai/..."; return; }
  await Store.add({ id:"u"+Date.now()+Math.random().toString(36).slice(2,6), sec:S.route, kind:"link", title, url, ts:Date.now() });
  rerenderKeepScroll(); toast("Сілтеме қосылды");
});

/* ---- File upload (input + drag&drop) ---- */
let pendingKind = null;
function pickFiles(kind, accept){ pendingKind = kind; const fi=$("#fileInput"); fi.accept = accept || ""; fi.value=""; fi.click(); }
$("#fileInput").addEventListener("change", e => { if(pendingKind) addFiles(pendingKind, [...e.target.files]); });
async function addFiles(kind, files){
  const want = kind==="video" ? /^video\// : /^image\//;
  const ok = files.filter(f => want.test(f.type));
  if(!ok.length){ toast(kind==="video" ? "Бейне файлын таңдаңыз (MP4, WebM)" : "Сурет файлын таңдаңыз (JPG, PNG, WebP)"); return; }
  for(const f of ok){

/* ---- Book reader (кітап болып парақталатын оқу құралы) ---- */
const BR = { b:null, n:0, spread:true, pos:0, busy:false, pw:0, ph:0 };
const R_PAGE = 595.32/841.92;
/* Кітап беттері бір файлда сақталады: books/NN/pages.json → {"pages":[base64 webp,…]} */
const BOOK_CACHE = {};
const pSrc = i => (BR.urls && BR.urls[i]) || "";
async function loadPages(dir){
  if(BOOK_CACHE[dir]) return BOOK_CACHE[dir];
  const res = await fetch(`${dir}/pages.json`); if(!res.ok) throw new Error(res.status);
  const data = await res.json();
  if(data.parts > 1){
    const rest = await Promise.all(Array.from({length:data.parts-1}, (_,k) => fetch(`${dir}/pages-${k+2}.json`).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })));
    rest.forEach(p => data.pages.push(...p.pages));
  }
  const urls = data.pages.map(b64 => { const bin = atob(b64), u8 = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k); return URL.createObjectURL(new Blob([u8], {type:"image/webp"})); });
  return (BOOK_CACHE[dir] = urls);
}
const okPage = i => i!=null && i>=0 && i<BR.n;
const brMax = () => BR.spread ? Math.floor(BR.n/2) : BR.n-1;
const brSpread = s => [s===0 ? null : 2*s-1, 2*s];
const pageImg = i => okPage(i) ? `<img src="${pSrc(i)}" alt="${i+1}-бет" draggable="false">` : "";
const brFace = (i, side) => `<div class="br-face ${side} ${okPage(i)?"":"paper"}">${pageImg(i)}</div>`;
function brSet(el, i){ el.innerHTML = pageImg(i); el.classList.toggle("blank", !okPage(i)); }

function openBook(i, kind = "book"){
  BR.b = items(secById(S.route), kind)[i]; BR.n = BR.b.pages; BR.pos = 0; BR.busy = false;
  const m = $("#bookModal");
  m.innerHTML = `<div class="backdrop br-bg" data-close></div>
    <div class="br-top">
      <span class="br-ic">${ic("book",20)}</span>
      <div class="br-t"><b>${esc(BR.b.title)}</b><small>${esc(BR.b.author)}${BR.b.grade?` · ${esc(BR.b.grade)}`:""}</small></div>
      <button class="icon-btn" data-br="zoom" aria-label="Үлкейту" title="Үлкейту">${ic("zoom",20)}</button>
      <button class="icon-btn" data-br="fs" aria-label="Толық экран" title="Толық экран">${ic("max",20)}</button>
      <button class="icon-btn" data-close aria-label="Жабу" title="Жабу">${ic("x",22)}</button>
    </div>
    <div class="br-stage" id="brStage">
      <button class="br-arrow prev" data-br="prev" aria-label="Алдыңғы бет">${ic("chevL",28)}</button>
      <div class="br-zoom" id="brZoom"><div class="br-book" id="brBook">
        <div class="br-page left" id="brL"></div><div class="br-page right" id="brR"></div><div class="br-spine" id="brSpine"></div>
      </div></div>
      <button class="br-arrow next" data-br="next" aria-label="Келесі бет">${ic("chevR",28)}</button>
    </div>
    <div class="br-bot">
      <button class="br-btn" data-br="first" aria-label="Мұқабаға оралу" title="Мұқаба">${ic("home",18)}</button>
      <input type="range" id="brRange" min="1" max="${BR.n}" value="1" aria-label="Бетке өту">
      <span class="br-cnt" id="brCnt"></span>
    </div>`;
  openModal("#bookModal");
  const st = $("#brStage"), book = $("#brBook");
  $("#brRange").addEventListener("input", e => { const p = +e.target.value - 1; BR.pos = BR.spread ? Math.ceil(p/2) : p; brRender(); });
  book.addEventListener("click", e => {
    if(st.classList.contains("zoom")) return;
    const r = book.getBoundingClientRect(), x = e.clientX - r.left;
    brGo(x < r.width*(BR.spread ? .5 : .33) ? -1 : 1);
  });
  let sx = null;
  st.addEventListener("touchstart", e => { sx = e.touches.length===1 ? e.touches[0].clientX : null; }, {passive:true});
  st.addEventListener("touchend", e => { if(sx===null || st.classList.contains("zoom")) return; const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx) > 45) brGo(dx < 0 ? 1 : -1); sx = null; });
  st.addEventListener("pointermove", e => { if(!st.classList.contains("zoom")) return; const r = st.getBoundingClientRect(); $("#brZoom").style.transformOrigin = `${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; });
  const bk = $("#brBook"), want = BR.b;
  BR.urls = BOOK_CACHE[BR.b.dir] || null;
  const start = () => {
    if(BR.b !== want || !$("#bookModal").classList.contains("open")) return;
    st.classList.remove("loading"); brLayout(true); bk.classList.add("enter");
    setTimeout(() => { bk.classList.remove("enter"); if(BR.spread && BR.pos === 0 && $("#bookModal").classList.contains("open")) brGo(1); }, 750);
  };
  if(BR.urls){ start(); return; }
  st.classList.add("loading"); BR.busy = true;
  loadPages(BR.b.dir).then(u => { if(BR.b !== want) return; BR.urls = u; BR.busy = false; start(); })
    .catch(() => { st.classList.remove("loading"); st.insertAdjacentHTML("beforeend", `<div class="br-msg">Кітапты жүктеу мүмкін болмады. Бетті жаңартып, қайта ашыңыз.</div>`); });
}
function brLayout(reset){
  const st = $("#brStage"); if(!st) return;
  const was = BR.spread;
  BR.spread = innerWidth >= 900;
  if(!reset && was !== BR.spread) BR.pos = BR.spread ? Math.ceil(BR.pos/2) : (BR.pos===0 ? 0 : 2*BR.pos-1);
  const avW = st.clientWidth - (BR.spread ? 150 : 20), avH = st.clientHeight - 20;
  BR.ph = Math.floor(BR.spread ? Math.min(avH, avW/2/R_PAGE) : Math.min(avH, avW/R_PAGE));
  BR.pw = BR.ph * R_PAGE;
  const book = $("#brBook");
  book.style.width = (BR.spread ? 2 : 1) * BR.pw + "px"; book.style.height = BR.ph + "px";
  book.classList.toggle("one", !BR.spread);
  brRender();
}
function brOffset(){
  const book = $("#brBook"); let dx = 0;
  if(BR.spread){ const [l, r] = brSpread(BR.pos); if(!okPage(l)) dx = -BR.pw/2; else if(!okPage(r)) dx = BR.pw/2; }
  book.style.transform = `translateX(${dx}px)`;
}
function brRender(){
  const L = $("#brL"), R = $("#brR"); if(!L) return;
  BR.pos = Math.max(0, Math.min(brMax(), BR.pos));
  let label, val;
  if(BR.spread){
    const [l, r] = brSpread(BR.pos);
    L.hidden = false; brSet(L, l); brSet(R, r);
    $("#brSpine").hidden = !(okPage(l) && okPage(r));
    label = okPage(l) && okPage(r) ? `${l+1}–${r+1}` : `${(okPage(l) ? l : r) + 1}`;
    val = (okPage(r) ? r : l) + 1;
  } else {
    L.hidden = true; brSet(R, BR.pos); $("#brSpine").hidden = true;
    label = `${BR.pos+1}`; val = BR.pos + 1;
  }
  R.classList.toggle("solo", !BR.spread);
  $("#brCnt").textContent = `${label} / ${BR.n} бет`;
  $("#brRange").value = val;
  $$("[data-br=prev]").forEach(b => b.disabled = BR.pos <= 0);
  $$("[data-br=next]").forEach(b => b.disabled = BR.pos >= brMax());
  brOffset(); brStack();
  for(let k = -2; k <= 5; k++){ const p = (BR.spread ? 2*BR.pos : BR.pos) + k; if(okPage(p)){ const im = new Image(); im.src = pSrc(p); } }
}
/* Қағаз бет иіліп парақталады: бет N жолаққа бөлініп, әр жолақ біртіндеп бұрылады */
function brCurl(o, done){
  const N = 22, W = BR.pw, H = BR.ph, sw = W / N, d = o.dir;
  const leaf = document.createElement("div");
  leaf.className = "br-curl";
  leaf.style.cssText = `width:${W}px;height:${H}px;left:${d>0 ? (BR.spread ? W : 0) : 0}px`;
  const bg = (i, x) => okPage(i) ? `background-image:url('${pSrc(i)}');background-size:${W}px ${H}px;background-position:${x}px 0` : "";
  let parent = leaf; const strips = [];
  for(let k = 0; k < N; k++){
    const el = document.createElement("div");
    el.className = "br-strip";
    const side = d > 0 ? "left" : "right";
    el.style.cssText = `width:${sw + 1.5}px;height:${H}px;${side}:${k===0 ? 0 : sw}px;transform-origin:${side} center`;
    const fx = d > 0 ? -k*sw : -(W - (k+1)*sw), bx = d > 0 ? -(W - (k+1)*sw) : -k*sw;
    el.innerHTML = `<div class="sf front ${okPage(o.front)?"":"paper"}" style="${bg(o.front, fx)}"><i></i></div><div class="sf back ${okPage(o.back)?"":"paper"}" style="${bg(o.back, bx)}"><i></i></div>`;
    parent.appendChild(el); parent = el; strips.push(el);
  }
  $("#brBook").appendChild(leaf);
  const shades = strips.map(el => [el.children[0].firstChild, el.children[1].firstChild]);
  const t0 = performance.now(), dur = 1050;
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const frame = now => {
    let p = ease(Math.min(1, (now - t0) / dur)); if(o.reverse) p = 1 - p;
    const theta = 180 * p, curl = 62 * Math.sin(Math.PI * p);
    let prev = 0; const phis = [];
    for(let k = 0; k <= N; k++){ const f = Math.pow(Math.min(k, N-1) / (N - 1), 1.7); phis.push(Math.min(180, theta + curl * f)); }
    const sa = k => { const f = k / N, lit = Math.sin(phis[k] * Math.PI / 180); return [0.04 + 0.42 * lit * (0.35 + 0.65*f), 0.03 + 0.3 * lit * (1 - 0.5*f)]; };
    for(let k = 0; k < N; k++){
      const r = phis[k] - prev; prev = phis[k];
      strips[k].style.transform = `rotateY(${-d * r}deg)`;
      const a = sa(k), b = sa(k+1), dirG = d > 0 ? "90deg" : "270deg", dirB = d > 0 ? "270deg" : "90deg";
      shades[k][0].style.background = `linear-gradient(${dirG},rgba(0,0,0,${a[0].toFixed(3)}),rgba(0,0,0,${b[0].toFixed(3)}))`;
      shades[k][1].style.background = `linear-gradient(${dirB},rgba(0,0,0,${a[1].toFixed(3)}),rgba(0,0,0,${b[1].toFixed(3)}))`;
    }
    leaf.style.filter = `drop-shadow(${-d * 14 * Math.sin(Math.PI*p)}px 10px 18px rgba(0,0,0,${(0.45*Math.sin(Math.PI*p)).toFixed(2)}))`;
    if((now - t0) < dur) requestAnimationFrame(frame); else { leaf.remove(); done(); }
  };
  requestAnimationFrame(frame);
}
function brGo(dir){
  if(BR.busy || !$("#brBook")) return;
  const np = BR.pos + dir; if(np < 0 || np > brMax()) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ BR.pos = np; brRender(); return; }
  BR.busy = true;
  let o;
  if(BR.spread){
    const [l, r] = brSpread(BR.pos), [nl, nr] = brSpread(np);
    if(dir > 0){ o = { dir:1, front:r, back:nl }; brSet($("#brR"), nr); }
    else { o = { dir:-1, front:l, back:nr }; brSet($("#brL"), nl); }
    $("#brSpine").hidden = true;
  } else {
    if(dir > 0){ o = { dir:1, front:BR.pos, back:null }; brSet($("#brR"), np); }
    else { o = { dir:1, front:np, back:null, reverse:true }; }
  }
  BR.pos = np; brOffset();
  brCurl(o, () => { brRender(); BR.busy = false; });
}
/* Кітаптың қалыңдығы: оқылған/қалған беттер жиегі */
function brStack(){
  const L = $("#brL"), R = $("#brR"); if(!L) return;
  const total = 7, done = Math.round(total * BR.pos / Math.max(1, brMax()));
  const layers = (n, sgn) => { const a = []; for(let i = 1; i <= n; i++) a.push(`${sgn*i*1.6}px ${i*0.9}px 0 -0.5px ${i%2 ? "#e9e3d3" : "#cfc7b3"}`); return a; };
  const drop = "0 30px 60px -10px rgba(0,0,0,.55)";
  if(BR.spread){
    const [l, r] = brSpread(BR.pos);
    L.style.boxShadow = okPage(l) ? [...layers(done, -1), drop].join(",") : "none";
    R.style.boxShadow = okPage(r) ? [...layers(total - done, 1), drop].join(",") : "none";
  } else { R.style.boxShadow = [...layers(Math.max(1, total - done), 1), drop].join(","); }
}
function brAction(a){
  if(a==="next") brGo(1);
  if(a==="prev") brGo(-1);
  if(a==="first"){ BR.pos = 0; brRender(); }
  if(a==="fs") toggleFs($("#bookModal"));
  if(a==="zoom"){ const st = $("#brStage"); st.classList.toggle("zoom"); if(!st.classList.contains("zoom")) $("#brZoom").style.transformOrigin = ""; }
}
window.addEventListener("resize", () => { if($("#bookModal")?.classList.contains("open")) brLayout(false); });

/* ---- Video theater (бейнеәңгімелер ойнатқышы) ---- */
function vtSelect(btn, i){
  const box = btn.closest("[data-vt]"), it = items(secById(S.route),"video")[i];
  const v = box.querySelector("video");
  v.pause(); v.poster = it.poster || ""; v.src = it.src; v.load();
  v.play().catch(()=>{});
  box.querySelector(".vt-n").textContent = `${String(i+1).padStart(2,"0")} / ${String(box.querySelectorAll(".vt-item").length).padStart(2,"0")}`;
  box.querySelector(".vt-info h4").textContent = it.caption;
  box.querySelector(".vt-info p").textContent = it.note || "";
  box.querySelectorAll(".vt-item").forEach(b => b.classList.toggle("on", b===btn));
  if(innerWidth < 1024) box.querySelector(".vt-screen").scrollIntoView({behavior:"smooth", block:"center"});
}

/* ---- Video ---- */
function openVideo(i){
  const sec = secById(S.route), it = items(sec,"video")[i];
  $("#videoModal").innerHTML = `<div class="backdrop" data-close></div>
    <div class="vd-box"><div class="vd-bar"><b>${esc(it.caption||"Бейне")}</b>
      <div style="display:flex;gap:4px"><button class="icon-btn" id="vdFs" aria-label="Толық экран">${ic("max",20)}</button><button class="icon-btn" data-close aria-label="Жабу">${ic("x",22)}</button></div></div>
      <video src="${esc(it.src)}" controls autoplay playsinline ${it.poster?`poster="${esc(it.poster)}"`:''}></video></div>`;
  openModal("#videoModal");
  const v=$("#videoModal video");
  v.addEventListener("error", ()=> toast("Бейнені ойнату мүмкін болмады — файл пішімін тексеріңіз"));
  $("#vdFs").onclick = () => toggleFs(v);
}

/* =========================================================================
   9. MOTION SYSTEM — reveal, counters, parallax, tilt, magnetic, header
   ========================================================================= */
let io;
function bindPage(skipAnim){
  mzInit();
  // Scroll reveal
  io?.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ en.target.classList.add("in"); if(en.target.querySelector("[data-count]")) countUp(en.target.querySelector("[data-count]"), skipAnim); io.unobserve(en.target); } }), { threshold:0, rootMargin:"0px 0px -60px 0px" });
  $$("[data-reveal]").forEach(el => io.observe(el));
  // 3D tilt + glare
  if(matchMedia("(hover:hover) and (pointer:fine)").matches){
    $$("[data-tilt]").forEach(card => {
      card.addEventListener("pointermove", e => {
        const r=card.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
        card.style.transform = `rotateX(${(.5-y)*10}deg) rotateY(${(x-.5)*12}deg) scale(1.03)`;
        card.style.setProperty("--gx", x*100+"%"); card.style.setProperty("--gy", y*100+"%");
      });
      card.addEventListener("pointerleave", () => { card.style.transform = ""; });
    });
    // Magnetic buttons
    $$(".magnetic").forEach(b => {
      b.addEventListener("pointermove", e => { const r=b.getBoundingClientRect(); b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`; });
      b.addEventListener("pointerleave", () => { b.style.transform=""; });
    });
  }
  // Hero entrance
  requestAnimationFrame(()=>document.body.classList.add("ready"));
  onScroll();
}
function countUp(el, instant){
  const to = +el.dataset.count; if(instant || !to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 1400;
  const step = now => { const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); el.textContent = Math.round(to*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    $("#hdr")?.classList.toggle("solid", y > 40 || S.route !== "home" && y > 10);
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)
      $$("[data-parallax]").forEach(el => { if(y < innerHeight*1.4) el.style.transform = `translate3d(0,${y*parseFloat(el.dataset.parallax)}px,0)`; });
    // Active TOC item
    if(S.route!=="home"){ let cur=null; $$(".block").forEach(b=>{ if(b.getBoundingClientRect().top < 160) cur=b.id; }); $$(".toc button").forEach(b=>b.classList.toggle("on", b.dataset.jump===cur)); }
    ticking=false;
  });
}
window.addEventListener("scroll", onScroll, { passive:true });

/* =========================================================================
   10. BOOT — жүктелу индикаторы
   ========================================================================= */
(async function boot(){
  const bar=$("#ldBar"), pct=$("#ldPct"); let p=0;
  const set = v => { p=Math.max(p,v); bar.style.width=p+"%"; pct.textContent=Math.round(p)+"%"; };
  set(8);
  const img = new Image(); const imgDone = new Promise(r=>{ img.onload=img.onerror=r; }); img.src = DATA.school.heroImage;
  const fonts = (document.fonts?.ready || Promise.resolve()).catch(()=>{});
  const tick = setInterval(()=> set(Math.min(90, p + 3 + Math.random()*6)), 90);
  await Promise.all([ Store.init().then(()=>set(40)), imgDone.then(()=>set(70)), Promise.race([fonts, wait(2500)]), wait(900) ]);
  clearInterval(tick); set(100);
  await render();
  await wait(250);
  $("#loader").classList.add("done");
})();
</script>
