<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Күйікқала құмырасы — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#102A43;--navy-2:#0B1F33;--gold:#D6B36A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 32%,#2c4866 0%,#163150 45%,#0B1F33 100%);color:#fff}
#stage{position:fixed;inset:0}
#c3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c3d:active{cursor:grabbing}
.hint{position:fixed;right:22px;top:26px;font:600 12.5px/1.3 Inter,sans-serif;color:rgba(255,255,255,.6);text-align:right}
.bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.bar button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.85);font:600 13.5px/1 Inter,sans-serif;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.12);color:#fff}
.bar button[aria-pressed="true"]{background:var(--gold);color:var(--navy-2)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font:600 15px/1.5 Inter,sans-serif}
@media (max-width:600px){.hint{display:none}.bar{bottom:14px}.bar button{padding:0 12px}.bar .lbl{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="c3d" aria-label="Күйікқала құмырасының 3D моделі"></canvas></div>
<div class="hint">Сүйреп бұрыңыз · дөңгелекпен жақындатыңыз</div>
<div class="bar">
  <button id="bSpin" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="lbl">Айналдыру</span></button>
  <button id="bReset"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 12h3M18 12h3M12 3v3M12 18v3"/></svg><span class="lbl">Бастапқы көрініс</span></button>
  <button id="bFs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span class="lbl">Толық экран</span></button>
</div>
<div class="fail" id="fail">3D көрініс ашылмады. Интернет байланысын тексеріп, бетті қайта жүктеңіз.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var H=70, WALL=3, NT=180, NY=46, TAU=Math.PI*2;
var CP=[[0,21],[4,24.6],[12,29],[24,33.4],[36,36.1],[46,37],[56,36.5],[63,35.2],[67,34.7],[70,35.6]];
function ro(y){
  y=Math.max(0,Math.min(H,y));
  var k=0; while(k<CP.length-2 && y>CP[k+1][0]) k++;
  function m(a,b){return (CP[b][1]-CP[a][1])/(CP[b][0]-CP[a][0]);}
  var y0=CP[k][0], r0=CP[k][1], y1=CP[k+1][0], r1=CP[k+1][1];
  var t0=k>0?m(k-1,k+1):m(k,k+1), t1=k<CP.length-2?m(k,k+2):m(k,k+1);
  var h=y1-y0, t=(y-y0)/h, t2=t*t, t3=t2*t;
  return (2*t3-3*t2+1)*r0+(t3-2*t2+t)*h*t0+(-2*t3+3*t2)*r1+(t3-t2)*h*t1;
}
function ri(y){return ro(Math.max(y,WALL))-WALL;}
function volTo(h){ // litres of water up to level h (cm)
  var v=0, dy=0.1;
  for(var y=WALL;y<h-1e-9;y+=dy){var r=ri(y+dy/2); v+=Math.PI*r*r*Math.min(dy,h-y);}
  return v/1000;
}
function levelFor(L){var lo=WALL,hi=H; for(var i=0;i<40;i++){var mid=(lo+hi)/2; if(volTo(mid)<L) lo=mid; else hi=mid;} return (lo+hi)/2;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){var h=Math.imul(a,374761393)+Math.imul(b,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function sm(t){return t*t*(3-2*t);}
function sstep(a,b,x){var t=Math.max(0,Math.min(1,(x-a)/(b-a)));return sm(t);}
function vn(u,v,P,seed){
  var iu=Math.floor(u), iv=Math.floor(v), fu=sm(u-iu), fv=sm(v-iv);
  function g(x,y){return hash(((x%P)+P)%P+seed*57, y+seed*131);}
  var a=g(iu,iv), b=g(iu+1,iv), c=g(iu,iv+1), d=g(iu+1,iv+1);
  return (a+(b-a)*fu)*(1-fv)+(c+(d-c)*fu)*fv;
}
function hex(h){return [((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
var C_SLIP=hex(0xa9ab90), C_TERRA=hex(0xb56c4d), C_PLASTER=hex(0x9d9d8f), C_IN=hex(0x643e31), C_EDGE=hex(0xa2573c);

function buildShardData(){
  var NV=(NY+1)*NT, OP=new Float32Array(NV*3), IP=new Float32Array(NV*3), ON=new Float32Array(NV*3), IN=new Float32Array(NV*3);
  var OC=new Float32Array(NV*3), IC=new Float32Array(NV*3);
  function vid(i,j){return j*NT+((i%NT)+NT)%NT;}
  var i,j,k;
  for(j=0;j<=NY;j++) for(i=0;i<NT;i++){
    var th=i/NT*TAU, y=j/NY*H, u=i/NT;
    var w=sstep(60.5,62.5,y)*(1-sstep(66.5,68.5,y));
    var ridge=Math.pow(0.5+0.5*Math.cos(th*30),1.5);
    var rough=j===0?0:(vn(u*40,y/3,40,5)-0.5)*0.5;
    var r=ro(y)+rough+1.0*w*ridge;
    var v=vid(i,j)*3;
    OP[v]=r*Math.cos(th); OP[v+1]=y; OP[v+2]=r*Math.sin(th);
    var yi=Math.max(y,WALL), r2=ri(yi)+(vn(u*40,y/3,40,9)-0.5)*0.4;
    IP[v]=r2*Math.cos(th); IP[v+1]=yi; IP[v+2]=r2*Math.sin(th);
    var n=0.65*vn(u*9,y/9,9,1)+0.35*vn(u*27,y/3.5,27,2);
    var br=0.9+0.2*vn(u*90,y/1.2,90,3);
    var col=(y<15.5+1.2*Math.sin(th*3))?C_PLASTER:mix(C_SLIP,C_TERRA,sstep(0.50,0.58,n));
    OC[v]=col[0]*br; OC[v+1]=col[1]*br; OC[v+2]=col[2]*br;
    IC[v]=C_IN[0]*br; IC[v+1]=C_IN[1]*br; IC[v+2]=C_IN[2]*br;
  }
  function normals(P,N,sign){
    for(var j=0;j<=NY;j++) for(var i=0;i<NT;i++){
      var a=vid(i+1,j)*3,b=vid(i-1,j)*3,c=vid(i,Math.min(j+1,NY))*3,d=vid(i,Math.max(j-1,0))*3;
      var ax=P[a]-P[b],ay=P[a+1]-P[b+1],az=P[a+2]-P[b+2], bx=P[c]-P[d],by=P[c+1]-P[d+1],bz=P[c+2]-P[d+2];
      var nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx, l=Math.sqrt(nx*nx+ny*ny+nz*nz);
      var th=i/NT*TAU, rx=Math.cos(th)*sign, rz=Math.sin(th)*sign;
      if(l<1e-6){nx=rx;ny=0;nz=rz;} else {nx/=l;ny/=l;nz/=l; if(nx*rx+nz*rz<0){nx=-nx;ny=-ny;nz=-nz;}}
      var v=vid(i,j)*3; N[v]=nx;N[v+1]=ny;N[v+2]=nz;
    }
  }
  normals(OP,ON,1); normals(IP,IN,-1);

  var rnd=mulberry32(7), seeds=[];
  var bands=[[3,16,4],[16,31,6],[31,46,7],[46,59,7],[61,70,6]];
  for(var b=0;b<bands.length;b++){
    var n2=bands[b][2], off=rnd()*TAU;
    for(k=0;k<n2;k++) seeds.push({th:((k+0.2+0.6*rnd())/n2*TAU+off)%TAU, y:bands[b][0]+rnd()*(bands[b][1]-bands[b][0]),
      missing:b===4||(b===3&&k===2), rimFound:b===4&&k<2, pos:[],nor:[],col:[]});
  }
  function nearest(th,y){
    var best=0,bd=1e9;
    for(var s=0;s<seeds.length;s++){var d=Math.abs(th-seeds[s].th); if(d>Math.PI)d=TAU-d; d*=34; var e=y-seeds[s].y, q=d*d+e*e; if(q<bd){bd=q;best=s;}}
    return best;
  }
  function P3(A,v){return [A[v*3],A[v*3+1],A[v*3+2]];}
  function addTri(S,P,N,C,want){
    var a=P[0],b=P[1],c=P[2];
    var ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    var gx=uy*vz-uz*vy, gy=uz*vx-ux*vz, gz=ux*vy-uy*vx;
    var o=[0,1,2];
    if(gx*want[0]+gy*want[1]+gz*want[2]<0){o=[0,2,1];gx=-gx;gy=-gy;gz=-gz;}
    var l=Math.sqrt(gx*gx+gy*gy+gz*gz)||1;
    for(var q=0;q<3;q++){
      var p=P[o[q]], n=N?N[o[q]]:[gx/l,gy/l,gz/l], cc=C[o[q]];
      S.pos.push(p[0],p[1],p[2]); S.nor.push(n[0],n[1],n[2]); S.col.push(cc[0],cc[1],cc[2]);
    }
  }
  // pass 1: assign triangles
  var tris=[], edges=new Map();
  function ekey(a,b){return a<b?a*100000+b:b*100000+a;}
  for(j=0;j<NY;j++) for(i=0;i<NT;i++){
    var A=[i,j],B=[i+1,j],Cc=[i+1,j+1],D=[i,j+1];
    var pair=((i+j)&1)?[[A,B,Cc],[A,Cc,D]]:[[A,B,D],[B,Cc,D]];
    for(k=0;k<2;k++){
      var t=pair[k], ci=(t[0][0]+t[1][0]+t[2][0])/3, cj=(t[0][1]+t[1][1]+t[2][1])/3;
      var s=nearest((ci/NT*TAU)%TAU, cj/NY*H);
      var vs=[vid(t[0][0],t[0][1]),vid(t[1][0],t[1][1]),vid(t[2][0],t[2][1])];
      tris.push({s:s,v:vs,th:ci/NT*TAU});
      for(var e=0;e<3;e++){var key=ekey(vs[e],vs[(e+1)%3]); var arr=edges.get(key); if(!arr){arr=[];edges.set(key,arr);} arr.push(s);}
    }
  }
  // pass 2: emit geometry
  for(k=0;k<tris.length;k++){
    var T=tris[k], S=seeds[T.s], v0=T.v[0],v1=T.v[1],v2=T.v[2];
    var rad=[Math.cos(T.th),0,Math.sin(T.th)];
    addTri(S,[P3(OP,v0),P3(OP,v1),P3(OP,v2)],[P3(ON,v0),P3(ON,v1),P3(ON,v2)],[P3(OC,v0),P3(OC,v1),P3(OC,v2)],rad);
    addTri(S,[P3(IP,v0),P3(IP,v1),P3(IP,v2)],[P3(IN,v0),P3(IN,v1),P3(IN,v2)],[P3(IC,v0),P3(IC,v1),P3(IC,v2)],[-rad[0],0,-rad[2]]);
    for(var e2=0;e2<3;e2++){
      var a2=T.v[e2], b2=T.v[(e2+1)%3], c2=T.v[(e2+2)%3], arr2=edges.get(ekey(a2,b2));
      var other=arr2.length<2?-1:(arr2[0]===T.s?arr2[1]:arr2[0]);
      if(arr2.length>=2 && arr2[0]===T.s && arr2[1]===T.s) continue;
      if(other===T.s) continue;
      var o1=P3(OP,a2), o2=P3(OP,b2), i1=P3(IP,a2), i2=P3(IP,b2), o3=P3(OP,c2);
      var want=[(o1[0]+o2[0])/2-o3[0],(o1[1]+o2[1])/2-o3[1],(o1[2]+o2[2])/2-o3[2]];
      var sh=0.85+0.3*hash(a2,b2), ce=[C_EDGE[0]*sh,C_EDGE[1]*sh,C_EDGE[2]*sh];
      addTri(S,[o1,o2,i2],null,[ce,ce,ce],want);
      addTri(S,[o1,i2,i1],null,[ce,ce,ce],want);
    }
  }
  var out=[];
  for(k=0;k<seeds.length;k++){
    var Sd=seeds[k], n3=Sd.pos.length/3; if(!n3) continue;
    var cx=0,cy=0,cz=0;
    for(i=0;i<n3;i++){cx+=Sd.pos[i*3];cy+=Sd.pos[i*3+1];cz+=Sd.pos[i*3+2];}
    cx/=n3;cy/=n3;cz/=n3;
    for(i=0;i<n3;i++){Sd.pos[i*3]=(Sd.pos[i*3]-cx)*0.988;Sd.pos[i*3+1]=(Sd.pos[i*3+1]-cy)*0.988;Sd.pos[i*3+2]=(Sd.pos[i*3+2]-cz)*0.988;}
    var dl=Math.sqrt(cx*cx+cz*cz)||1;
    out.push({pos:Sd.pos,nor:Sd.nor,col:Sd.col,c:[cx,cy,cz],dir:[cx/dl,0,cz/dl],y:Sd.y,th:Sd.th,missing:Sd.missing,rimFound:Sd.rimFound});
  }
  return out;
}
// heat model: 0.5 l of water, Newton cooling
function heatK(dmm,lambda,evap){
  var hOut=10, A=0.035, U=1/(1/hOut+(dmm/1000)/lambda), top=25*0.005;
  return (U*A*(evap?1.3:1)+top)/(0.5*4186);
}
function heatT(T0,Tr,k,min){return Tr+(T0-Tr)*Math.exp(-k*min*60);}
var ABS_MODEL=[9,13,17];
function absWet(dry,min,idx){return dry*(1+ABS_MODEL[idx]/100*(1-Math.exp(-min/12)));}

function $(id){return document.getElementById(id);}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(typeof THREE==='undefined'){ $('fail').style.display='flex'; return; }
var canvas=$('c3d'), stage=$('stage'), renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true}); }
catch(e){ $('fail').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(36,1,5,2000);
scene.add(new THREE.HemisphereLight(0xfff4e2,0x2a323c,0.8));
var sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(90,150,130); scene.add(sun);
var fill=new THREE.DirectionalLight(0xbfd6ea,0.3); fill.position.set(-120,60,-90); scene.add(fill);

var shardMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0,side:THREE.DoubleSide});
var baseOutMat=new THREE.MeshStandardMaterial({color:0x9d9d8f,roughness:1,side:THREE.DoubleSide});
var baseInMat=new THREE.MeshStandardMaterial({color:0x643e31,roughness:1,side:THREE.DoubleSide});

// мұражай сөресі
var table=new THREE.Mesh(new THREE.CylinderGeometry(120,120,3,72),new THREE.MeshStandardMaterial({color:0x8d6a4a,roughness:0.75}));
table.position.y=-1.6; scene.add(table);

// құмыра (мұражайдағы күйі: сақталған сынықтар)
buildShardData().forEach(function(d){
  if(d.missing) return;
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(d.pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(d.nor,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(d.col,3));
  var mesh=new THREE.Mesh(g,shardMat); mesh.position.set(d.c[0],d.c[1],d.c[2]); scene.add(mesh);
});
var bOut=new THREE.Mesh(new THREE.CircleGeometry(ro(0),72),baseOutMat); bOut.rotation.x=-Math.PI/2; bOut.position.y=0.02; scene.add(bOut);
var bIn=new THREE.Mesh(new THREE.CircleGeometry(ri(WALL)+0.2,72),baseInMat); bIn.rotation.x=-Math.PI/2; bIn.position.y=WALL; scene.add(bIn);

// камера
var HOME={az:0.55,pol:1.2,dist:235}, orb={az:HOME.az,pol:HOME.pol,dist:HOME.dist}, target=new THREE.Vector3(0,34,0);
var spin=!reduce, homing=null;
if(reduce) $('bSpin').setAttribute('aria-pressed','false');
function placeCam(){
  var sp=Math.sin(orb.pol);
  camera.position.set(target.x+orb.dist*sp*Math.sin(orb.az),target.y+orb.dist*Math.cos(orb.pol),target.z+orb.dist*sp*Math.cos(orb.az));
  camera.lookAt(target);
}
var ptrs=new Map(), pinch0=0, lastInput=0;
canvas.addEventListener('pointerdown',function(e){ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===2){var a=Array.from(ptrs.values()); pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);} lastInput=performance.now(); homing=null; });
canvas.addEventListener('pointermove',function(e){
  var p=ptrs.get(e.pointerId); if(!p) return;
  var dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; lastInput=performance.now();
  if(ptrs.size===1){ orb.az-=dx*0.006; orb.pol=Math.max(0.15,Math.min(1.5,orb.pol-dy*0.005)); }
  else if(ptrs.size===2){ var a=Array.from(ptrs.values()), d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinch0>0) orb.dist=Math.max(110,Math.min(420,orb.dist*pinch0/d)); pinch0=d; }
});
function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=0; }
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',function(e){e.preventDefault();orb.dist=Math.max(110,Math.min(420,orb.dist*(e.deltaY>0?1.08:0.93)));lastInput=performance.now();},{passive:false});

$('bSpin').onclick=function(){ spin=!spin; this.setAttribute('aria-pressed',spin); };
$('bReset').onclick=function(){ homing={t:0,from:{az:orb.az,pol:orb.pol,dist:orb.dist}}; };
$('bFs').onclick=function(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }catch(_){} };

var W=0,Hh=0,last=performance.now();
function size(){ var w=stage.clientWidth,h=stage.clientHeight; if(w===W&&h===Hh||!w||!h) return; W=w;Hh=h; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  size();
  if(homing){
    homing.t=Math.min(1,homing.t+dt/0.9); var k=1-Math.pow(1-homing.t,3), f=homing.from;
    var daz=((HOME.az-f.az)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;
    orb.az=f.az+daz*k; orb.pol=f.pol+(HOME.pol-f.pol)*k; orb.dist=f.dist+(HOME.dist-f.dist)*k;
    if(homing.t>=1) homing=null;
  } else if(spin&&ptrs.size===0&&now-lastInput>2500) orb.az+=dt*0.18;
  placeCam();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
